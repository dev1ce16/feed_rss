<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>News Hub JSON</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f0f2f5; color: #333; }
        .container { max-width: 800px; margin: 50px auto; padding: 20px; }
        .search-area { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); text-align: center; }
        input { padding: 12px; width: 60%; border: 2px solid #ddd; border-radius: 6px; outline: none; }
        button { padding: 12px 24px; background: #1a73e8; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; }
        #news-container { margin-top: 30px; }
        .card { background: white; padding: 20px; margin-bottom: 15px; border-radius: 8px; border-left: 5px solid #1a73e8; }
        .source { font-size: 0.75rem; color: #1a73e8; font-weight: bold; text-transform: uppercase; }
        .error { color: #d93025; background: #f8d7da; padding: 15px; border-radius: 8px; text-align: center; }
        .loading { font-style: italic; color: #666; }
    </style>
</head>
<body>

<div class="container">
    <div class="search-area">
        <h1>Global News Aggregator</h1>
        <input type="text" id="categoryInput" placeholder="Digita 'politica' o 'sport'...">
        <button onclick="fetchNews()">Cerca</button>
    </div>

    <div id="news-container"></div>
</div>

<script>
async function fetchNews() {
    const category = document.getElementById('categoryInput').value.toLowerCase();
    const container = document.getElementById('news-container');
    
    // Mappa dei feed direttamente nel frontend
    const feeds = {
        "politica": [
            "https://www.ansa.it/sito/notizie/politica/politica_rss.xml",
            "https://www.ilfattoquotidiano.it/politica/feed/"
        ],
        "sport": [
            "https://sport.sky.it/rss/sport_all.xml",
            "https://www.gazzetta.it/rss/home.xml"
        ]
    };

    if (!feeds[category]) {
        container.innerHTML = `<div class="error">⚠️ Categoria non trovata. Prova 'politica' o 'sport'.</div>`;
        return;
    }

    container.innerHTML = '<p class="loading">Caricamento notizie in corso...</p>';
    container.innerHTML = ''; 

    try {
        // Interroghiamo ogni feed usando un'API di conversione gratuita
        for (const url of feeds[category]) {
            const api_url = `https://api.rss2json.com/v1/api.json?rss_url=${encodeURIComponent(url)}`;
            
            const response = await fetch(api_url);
            const data = await response.json();

            if (data.status === 'ok') {
                data.items.slice(0, 5).forEach(news => {
                    container.innerHTML += `
                        <div class="card">
                            <div class="source">${data.feed.title}</div>
                            <h3>${news.title}</h3>
                            <p>${news.description.substring(0, 150)}...</p>
                            <small>${news.pubDate}</small><br><br>
                            <a href="${news.link}" target="_blank">Leggi di più</a>
                        </div>
                    `;
                });
            }
        }
    } catch (err) {
        container.innerHTML = `<div class="error">⚠️ Servizio momentaneamente non disponibile.</div>`;
    }
}
</script>

</body>

</html>
